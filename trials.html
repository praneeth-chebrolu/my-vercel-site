<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cancer Clinical Trials | Trial List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      font-family: Arial, sans-serif;
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.6;
      color: #1f2937;
    }
    header{
      display:flex; align-items:baseline; justify-content:space-between;
      gap:16px; margin-bottom:18px; flex-wrap: wrap;
    }
    nav a{ margin-left: 14px; text-decoration:none; color:#1f2937; white-space: nowrap; }
    nav a:hover{ text-decoration:underline; }

    .card{ border:1px solid #e5e7eb; border-radius:14px; padding:18px; background:#fff; }
    .muted{ color:#6b7280; font-size:14px; }
    a{ color:#2563eb; }

    .filters{
      display:grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap:12px; margin-top:12px;
    }
    input, select{
      width:100%; padding:10px; border-radius:10px; border:1px solid #d1d5db; background:#fff;
      font: inherit;
    }
    .grid{ display:grid; grid-template-columns: 1fr; gap:14px; margin-top:14px; }
    @media (min-width: 700px){ .grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (min-width: 1000px){ .grid{ grid-template-columns: repeat(3, minmax(0, 1fr)); } }

    .trial{
      border:1px solid #e5e7eb; border-radius:14px; padding:14px; background:#fff;
      display:flex; flex-direction:column; gap:10px; min-height: 210px;
    }
    .badgeRow{ display:flex; gap:8px; flex-wrap:wrap; }
    .badge{
      font-size:12px; border:1px solid #d1d5db; border-radius:999px; padding:4px 10px;
      background:#f9fafb; white-space: nowrap;
    }
    .badge.status-recruiting{ background:#ecfdf5; border-color:#10b981; color:#065f46; }
    .badge.status-soon{ background:#eff6ff; border-color:#3b82f6; color:#1e40af; }
    .badge.status-other{ background:#f3f4f6; border-color:#9ca3af; color:#374151; }

    button{
      padding:10px 12px; border-radius:10px; border:1px solid #d1d5db; background:#f9fafb;
      cursor:pointer; font-weight:600; text-align:left; font: inherit;
    }
    button:hover{ background:#f3f4f6; }
    .actions{ margin-top:auto; display:flex; gap:10px; flex-wrap:wrap; align-items: center; }
    .loc{ font-size:13px; color:#6b7280; }

    @media (max-width: 900px){ .filters{ grid-template-columns: 1fr 1fr; } }
    @media (max-width: 560px){ .filters{ grid-template-columns: 1fr; } }

    .modalBackdrop{
      position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none;
      align-items: center; justify-content: center; padding: 12px; z-index: 9999;
    }
    .modal{
      width: 100%; max-width: 820px; background: #fff; border-radius: 16px; border: 1px solid #e5e7eb;
      max-height: calc(100vh - 24px); overflow: hidden; display:flex; flex-direction: column;
    }
    .modalHeader{
      display:flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 14px 16px; border-bottom: 1px solid #e5e7eb; background: #fff;
    }
    .modalHeader h3{ margin:0; font-size: 16px; line-height: 1.3; }
    .closeBtn{ width:auto; text-align:center; white-space: nowrap; }
    .modalBody{ padding: 14px 16px; overflow: auto; -webkit-overflow-scrolling: touch; }
    .modalBody ul{ margin: 8px 0 0 18px; }
  </style>
</head>

<body>
  <header>
    <h1 style="margin:0;">Cancer Clinical Trials</h1>
    <nav>
      <a href="index.html">Cancer Types</a>
      <a href="trials.html">Trial List</a>
      <a href="intake.html">Intake</a>
      <a href="illinois/research-deserts.html">Research Deserts</a>
    </nav>
  </header>

  <section class="card">
    <h2 style="margin:0;">Open clinical trials</h2>
    <p class="muted" style="margin:6px 0 0 0;">
      Live from <a href="https://clinicaltrials.gov" target="_blank" rel="noreferrer">ClinicalTrials.gov</a> &mdash;
      choose a disease group to see trials currently open for enrollment. Click a trial for a plain-language overview.
    </p>

    <div class="filters">
      <input id="q" placeholder="Search within results (keyword, NCT ID)" />

      <select id="cancer">
        <option value="">All cancer types</option>
        <option>Bladder cancer</option>
        <option>Brain cancer</option>
        <option>Breast cancer</option>
        <option>Childhood cancer</option>
        <option>Colon &amp; rectal cancer</option>
        <option>Gastrointestinal cancer</option>
        <option>Gynecologic cancer</option>
        <option>Head &amp; neck cancer</option>
        <option>Kidney cancer</option>
        <option>Lung cancer</option>
        <option>Prostate cancer</option>
        <option>Skin cancer</option>
        <option>Testicular cancer</option>
      </select>

      <select id="status">
        <option value="RECRUITING">Recruiting (open)</option>
        <option value="NOT_YET_RECRUITING">Not yet recruiting</option>
        <option value="">Any status</option>
      </select>

      <input id="locn" placeholder="Location (e.g., Illinois) — optional" />
    </div>

    <div id="results" class="grid"></div>
    <p id="count" class="muted"></p>
  </section>

  <div id="backdrop" class="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="modal">
      <div class="modalHeader">
        <h3 id="mTitle"></h3>
        <button id="close" class="closeBtn">Close</button>
      </div>
      <div id="mBody" class="modalBody muted"></div>
      <div style="padding: 0 16px 16px 16px;">
        <a id="mLink" href="#" target="_blank" rel="noreferrer">Open on ClinicalTrials.gov</a>
      </div>
    </div>
  </div>

  <script>
    const API = "https://clinicaltrials.gov/api/v2/studies";

    // Map each disease-group label to a ClinicalTrials.gov condition query (Essie syntax; OR broadens).
    const CONDITION_QUERY = {
      "Bladder cancer":       "bladder cancer OR urothelial carcinoma",
      "Brain cancer":         "brain tumor OR glioblastoma OR glioma OR astrocytoma",
      "Breast cancer":        "breast cancer",
      "Childhood cancer":     "childhood cancer OR pediatric cancer",
      "Colon & rectal cancer":"colorectal cancer",
      "Gastrointestinal cancer":"gastrointestinal cancer OR colorectal cancer OR pancreatic cancer OR gastric cancer OR esophageal cancer OR liver cancer",
      "Gynecologic cancer":   "ovarian cancer OR cervical cancer OR endometrial cancer OR uterine cancer",
      "Head & neck cancer":   "head and neck cancer",
      "Kidney cancer":        "kidney cancer OR renal cell carcinoma",
      "Lung cancer":          "lung cancer OR NSCLC OR SCLC",
      "Prostate cancer":      "prostate cancer",
      "Skin cancer":          "skin cancer OR melanoma",
      "Testicular cancer":    "testicular cancer"
    };
    const PAGE_SIZE = 60;

    const qEl = document.getElementById("q");
    const cancerEl = document.getElementById("cancer");
    const statusEl = document.getElementById("status");
    const locnEl = document.getElementById("locn");
    const resultsEl = document.getElementById("results");
    const countEl = document.getElementById("count");
    const backdrop = document.getElementById("backdrop");
    const closeBtn = document.getElementById("close");
    const mTitle = document.getElementById("mTitle");
    const mBody = document.getElementById("mBody");
    const mLink = document.getElementById("mLink");

    let TRIALS = [];
    let TOTAL = 0;
    let queryToken = 0;

    // ---------- helpers ----------
    function cleanText(s){ return (s || "").replace(/\s+/g, " ").trim(); }
    function firstNonEmpty(...vals){ for (const v of vals) if (typeof v === "string" && v.trim()) return v.trim(); return ""; }
    function escapeHtml(s){
      return String(s || "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
        .replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }
    function prettyStatus(raw){
      const map = {
        RECRUITING:"Recruiting", NOT_YET_RECRUITING:"Not yet recruiting",
        ENROLLING_BY_INVITATION:"Enrolling by invitation", ACTIVE_NOT_RECRUITING:"Active, not recruiting",
        COMPLETED:"Completed", SUSPENDED:"Suspended", TERMINATED:"Terminated", WITHDRAWN:"Withdrawn"
      };
      return map[raw] || cleanText((raw||"").replaceAll("_"," ").toLowerCase());
    }
    function statusClass(raw){
      if (raw === "RECRUITING") return "status-recruiting";
      if (raw === "NOT_YET_RECRUITING" || raw === "ENROLLING_BY_INVITATION") return "status-soon";
      return "status-other";
    }
    function getPhaseText(designMod){
      const phases = Array.isArray(designMod?.phases) ? designMod.phases : [];
      const p = phases.filter(x => x && x !== "NA").map(x => x.replace("PHASE","Phase ").replace("_"," "));
      return p.length ? p.join(", ") : "Phase not listed";
    }
    function getSponsorText(sponsorMod){
      const lead = sponsorMod?.leadSponsor?.name;
      return lead ? cleanText(lead) : "Sponsor not listed";
    }
    function listNames(arr, key="name", max=4){
      if (!Array.isArray(arr)) return [];
      return arr.map(x => (typeof x === "string" ? x : x?.[key])).filter(Boolean).map(cleanText).slice(0, max);
    }
    function getInterventionSummary(interventionsMod){
      return listNames(interventionsMod?.interventions, "name", 4).join(", ");
    }
    function getOverview(descMod){
      const raw = firstNonEmpty(descMod?.briefSummary, descMod?.detailedDescription, "");
      return raw.replace(/\r/g," ").replace(/\n+/g," ").replace(/\s+/g," ").trim();
    }
    function shortOverview(text, { phase, diseaseFocus, interventionsSummary }){
      const parts = [];
      if (phase && phase !== "Phase not listed") parts.push(`This is a ${phase} clinical trial.`);
      if (diseaseFocus) parts.push(`It focuses on ${diseaseFocus}.`);
      if (interventionsSummary) parts.push(`Treatment may include ${interventionsSummary}.`);
      const prefix = parts.length ? parts.join(" ") + " " : "";
      if (!text) return prefix || "Study overview is not listed on ClinicalTrials.gov.";
      const sentences = text.split(/(?<=[.?!])\s+/).filter(Boolean).slice(0, 3).join(" ");
      const trimmed = sentences.length > 650 ? sentences.slice(0, 650).trim() + "…" : sentences;
      return (prefix + trimmed).trim();
    }
    function parseEligibility(raw){
      const text = (raw || "").replace(/\r/g, "");
      if (!text.trim()) return { inclusion: [], exclusion: [] };
      const lower = text.toLowerCase();
      const incIdx = lower.indexOf("inclusion criteria");
      const excIdx = lower.indexOf("exclusion criteria");
      let incText = "", excText = "";
      if (incIdx !== -1 && excIdx !== -1){
        if (incIdx < excIdx){ incText = text.slice(incIdx, excIdx); excText = text.slice(excIdx); }
        else { excText = text.slice(excIdx, incIdx); incText = text.slice(incIdx); }
      } else if (incIdx !== -1) incText = text.slice(incIdx);
      else if (excIdx !== -1) excText = text.slice(excIdx);
      function toBullets(sectionText){
        const cleaned = sectionText.replace(/inclusion criteria[:\s]*/i,"").replace(/exclusion criteria[:\s]*/i,"").trim();
        if (!cleaned) return [];
        return cleaned.split(/\n+/).map(l => l.trim()).filter(Boolean).map(l => l.replace(/^[-–•\s]*/,"").trim()).slice(0, 8);
      }
      return { inclusion: toBullets(incText), exclusion: toBullets(excText) };
    }
    function whoCanJoin(diseaseFocus, elig){
      const who = [];
      const minAge = elig?.minimumAge, maxAge = elig?.maximumAge, sex = elig?.sex;
      if (minAge || maxAge){
        const a = [];
        if (minAge) a.push(`at least ${minAge}`);
        if (maxAge) a.push(`up to ${maxAge}`);
        who.push(`Age: People who are ${a.join(" and ")}.`);
      }
      if (sex && sex !== "ALL") who.push(`Sex: This study is only for ${sex.toLowerCase()} participants.`);
      if (diseaseFocus) who.push(`Condition: People diagnosed with ${diseaseFocus}.`);
      const parsed = parseEligibility(elig?.eligibilityCriteria || "");
      if (parsed.inclusion.length) return [...who, ...parsed.inclusion].slice(0, 8);
      who.push("Other eligibility rules apply. The study team will confirm eligibility.");
      return who.slice(0, 8);
    }
    function whoCannotJoin(elig){
      const parsed = parseEligibility(elig?.eligibilityCriteria || "");
      if (parsed.exclusion.length) return parsed.exclusion.slice(0, 8);
      return ["People who do not meet the study’s eligibility requirements.",
              "The study team will confirm eligibility after review."];
    }
    function summarizeLocations(locations){
      if (!Array.isArray(locations) || !locations.length) return { line:"", all:[] };
      const rec = locations.filter(l => /RECRUITING/i.test(l.status || ""));
      const use = rec.length ? rec : locations;
      const fmt = l => [l.facility, l.city, l.state].filter(Boolean).join(", ");
      const top = use.slice(0, 3).map(fmt);
      const extra = use.length > 3 ? ` +${use.length - 3} more site(s)` : "";
      return { line: (top[0] || "") + (use.length > 1 ? ` +${use.length - 1} more` : ""),
               all: top, extra, count: use.length };
    }

    function toModel(study){
      const p = study.protocolSection || {};
      const idMod = p.identificationModule || {};
      const statusMod = p.statusModule || {};
      const designMod = p.designModule || {};
      const condMod = p.conditionsModule || {};
      const descMod = p.descriptionModule || {};
      const sponsorMod = p.sponsorCollaboratorsModule || {};
      const interventionsMod = p.armsInterventionsModule || {};
      const eligMod = p.eligibilityModule || {};
      const contactsMod = p.contactsLocationsModule || {};

      const id = idMod.nctId || "";
      const title = firstNonEmpty(idMod.briefTitle, idMod.officialTitle, "Title not listed");
      const phase = getPhaseText(designMod);
      const rawStatus = statusMod.overallStatus || "";
      const conditions = Array.isArray(condMod.conditions) ? condMod.conditions : [];
      const cancer = conditions[0] || "Cancer";
      const interventionsSummary = getInterventionSummary(interventionsMod);
      const overviewText = shortOverview(getOverview(descMod), { phase, diseaseFocus: cancer, interventionsSummary });
      const central = Array.isArray(contactsMod.centralContacts) ? contactsMod.centralContacts[0] : null;
      const loc = summarizeLocations(contactsMod.locations);

      return {
        id,
        ctgovLink: `https://clinicaltrials.gov/study/${id}`,
        title, phase, rawStatus, statusText: prettyStatus(rawStatus),
        cancer, conditions, sponsor: getSponsorText(sponsorMod),
        overviewText,
        whoCanJoin: whoCanJoin(cancer, eligMod),
        whoCannotJoin: whoCannotJoin(eligMod),
        contactName: central?.name || "", contactPhone: central?.phone || "", contactEmail: central?.email || "",
        locLine: loc.line, locAll: loc.all, locExtra: loc.extra || "", locCount: loc.count || 0,
        note: "Eligibility shown here is high-level and not complete. Final eligibility is determined by the study team in coordination with your cancer care team."
      };
    }

    // ---------- query ClinicalTrials.gov ----------
    function buildUrl(cond, statusVal, locn){
      const p = new URLSearchParams();
      p.set("query.cond", cond);
      if (statusVal) p.set("filter.overallStatus", statusVal);
      if (locn) p.set("query.locn", locn);
      p.set("pageSize", String(PAGE_SIZE));
      p.set("countTotal", "true");
      return `${API}?${p.toString()}`;
    }
    function ctgovSearchLink(cond, statusVal, locn){
      const p = new URLSearchParams();
      p.set("cond", cond);
      const agg = [];
      if (statusVal === "RECRUITING") agg.push("status:rec");
      if (statusVal === "NOT_YET_RECRUITING") agg.push("status:not");
      if (agg.length) p.set("aggFilters", agg.join(","));
      if (locn) p.set("locStr", locn);
      return `https://clinicaltrials.gov/search?${p.toString()}`;
    }

    async function load(){
      const token = ++queryToken;
      const label = cancerEl.value;
      const cond = CONDITION_QUERY[label] || (label ? label : "cancer");
      const statusVal = statusEl.value;
      const locn = cleanText(locnEl.value);

      resultsEl.innerHTML = `<div class="muted">Loading open trials from ClinicalTrials.gov…</div>`;
      countEl.textContent = "";

      try {
        const res = await fetch(buildUrl(cond, statusVal, locn), { headers: { "Accept": "application/json" } });
        if (!res.ok) throw new Error(`ClinicalTrials.gov returned ${res.status}`);
        const data = await res.json();
        if (token !== queryToken) return; // a newer query superseded this one
        TRIALS = (data.studies || []).map(toModel).filter(t => t.id);
        TOTAL = data.totalCount || TRIALS.length;
        render();
      } catch (e) {
        if (token !== queryToken) return;
        const link = ctgovSearchLink(cond, statusVal, locn);
        resultsEl.innerHTML =
          `<div class="muted">Couldn’t load trials directly right now (${escapeHtml(e.message || "network error")}).</div>
           <div style="margin-top:8px;"><a href="${link}" target="_blank" rel="noreferrer">View these open trials on ClinicalTrials.gov →</a></div>`;
        countEl.textContent = "";
      }
    }

    function keywordMatch(t){
      const q = cleanText(qEl.value).toLowerCase();
      if (!q) return true;
      return [t.id, t.title, t.cancer, t.phase, t.statusText, t.sponsor, t.overviewText, t.locLine]
        .join(" ").toLowerCase().includes(q);
    }

    function render(){
      const filtered = TRIALS.filter(keywordMatch);
      resultsEl.innerHTML = filtered.map(t => `
        <div class="trial">
          <div class="badgeRow">
            <span class="badge">${escapeHtml(t.cancer)}</span>
            <span class="badge">${escapeHtml(t.phase)}</span>
            <span class="badge ${statusClass(t.rawStatus)}">${escapeHtml(t.statusText)}</span>
          </div>
          <div>
            <div style="font-weight:700; font-size:16px;">${escapeHtml(t.title)}</div>
            <div class="muted">
              <a href="${t.ctgovLink}" target="_blank" rel="noreferrer">${escapeHtml(t.id)}</a>
              ${t.sponsor ? `• ${escapeHtml(t.sponsor)}` : ""}
            </div>
            ${t.locLine ? `<div class="loc">📍 ${escapeHtml(t.locLine)}</div>` : ""}
          </div>
          <div class="actions">
            <button type="button" onclick="openModal('${escapeHtml(t.id)}')">View details</button>
            <a href="intake.html?nct=${encodeURIComponent(t.id)}">I’m interested</a>
          </div>
        </div>
      `).join("") || `<div class="muted">No trials matched. Try a different disease group or clear the search.</div>`;

      const label = cancerEl.value || "all cancers";
      const shown = filtered.length;
      const more = TOTAL > TRIALS.length ? ` of ${TOTAL.toLocaleString()} open on ClinicalTrials.gov` : "";
      const link = ctgovSearchLink(CONDITION_QUERY[cancerEl.value] || (cancerEl.value || "cancer"), statusEl.value, cleanText(locnEl.value));
      countEl.innerHTML = `Showing ${shown} ${escapeHtml(label)} trial(s)${more}. ` +
        `<a href="${link}" target="_blank" rel="noreferrer">View all on ClinicalTrials.gov →</a>`;
    }

    function bulletsToHtml(arr){
      if (!arr || !arr.length) return "<div class='muted'>Not listed.</div>";
      return `<ul>${arr.map(x => `<li>${escapeHtml(x)}</li>`).join("")}</ul>`;
    }

    window.openModal = function(id){
      const t = TRIALS.find(x => x.id === id);
      if (!t) return;
      mTitle.textContent = `${t.title} (${t.id})`;
      const contactBits = [t.contactName, t.contactPhone, t.contactEmail].filter(Boolean).map(escapeHtml).join(" · ");
      mBody.innerHTML = `
        <div><strong>Cancer:</strong> ${escapeHtml(t.cancer)}</div>
        <div><strong>Study phase:</strong> ${escapeHtml(t.phase)}</div>
        <div><strong>Status:</strong> <span class="badge ${statusClass(t.rawStatus)}">${escapeHtml(t.statusText)}</span></div>
        <div><strong>Sponsor:</strong> ${escapeHtml(t.sponsor)}</div>
        <div style="margin-top:10px;"><strong>ClinicalTrials.gov ID:</strong>
          <a href="${t.ctgovLink}" target="_blank" rel="noreferrer">${escapeHtml(t.id)}</a></div>

        <div style="margin-top:14px;"><strong>Study overview</strong></div>
        <div style="margin-top:6px;">${escapeHtml(t.overviewText)}</div>

        <div style="margin-top:14px;"><strong>Who can join</strong></div>
        ${bulletsToHtml(t.whoCanJoin)}
        <div style="margin-top:10px;"><strong>Who cannot join</strong></div>
        ${bulletsToHtml(t.whoCannotJoin)}
        <div style="margin-top:10px;" class="muted"><strong>Note:</strong> ${escapeHtml(t.note)}</div>

        ${t.locAll.length ? `<div style="margin-top:14px;"><strong>Where (recruiting sites)</strong></div>
          ${bulletsToHtml(t.locAll)}${t.locExtra ? `<div class="muted">${escapeHtml(t.locExtra)}</div>` : ""}` : ""}

        <div style="margin-top:14px;"><strong>How to join</strong></div>
        <div>Ask your oncologist for a referral, or use the “I’m interested” button.${contactBits ? ` Study contact: ${contactBits}.` : ""}</div>
      `;
      mLink.href = t.ctgovLink;
      backdrop.style.display = "flex";
    };

    function closeModal(){ backdrop.style.display = "none"; }
    closeBtn.addEventListener("click", closeModal);
    backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeModal(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && backdrop.style.display === "flex") closeModal(); });

    // keyword filters client-side; the others re-query ClinicalTrials.gov
    qEl.addEventListener("input", render);
    cancerEl.addEventListener("change", load);
    statusEl.addEventListener("change", load);
    let locnTimer;
    locnEl.addEventListener("input", () => { clearTimeout(locnTimer); locnTimer = setTimeout(load, 500); });

    (function init(){
      const params = new URLSearchParams(window.location.search);
      const cancerFromUrl = params.get("cancer");
      if (cancerFromUrl) {
        // match against option labels case-insensitively
        const opt = [...cancerEl.options].find(o => o.value.toLowerCase() === cancerFromUrl.toLowerCase());
        if (opt) cancerEl.value = opt.value;
      }
      const locFromUrl = params.get("locn");
      if (locFromUrl) locnEl.value = locFromUrl;
      load();
    })();
  </script>
</body>
</html>
