<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cancer Clinical Trials | Trial List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{ font-family: Arial, sans-serif; max-width: 1100px; margin: 40px auto; padding: 0 16px; line-height: 1.6; color: #1f2937; }
    header{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap: wrap; }
    nav a{ margin-left: 14px; text-decoration:none; color:#1f2937; white-space: nowrap; }
    nav a:hover{ text-decoration:underline; }
    .card{ border:1px solid #e5e7eb; border-radius:14px; padding:18px; background:#fff; }
    .muted{ color:#6b7280; font-size:14px; }
    a{ color:#2563eb; }

    .filters{ display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:12px; margin-top:12px; }
    input, select{ width:100%; padding:10px; border-radius:10px; border:1px solid #d1d5db; background:#fff; font: inherit; }
    label.f{ font-size:12px; color:#6b7280; display:block; margin-bottom:4px; }
    .zipRow{ display:flex; gap:8px; align-items:center; }
    .zipRow input{ max-width:160px; }
    .locNote{ margin-top:10px; font-size:13px; }

    .section{ border-top:1px solid #e5e7eb; margin-top:14px; }
    .section > summary{ cursor:pointer; list-style:none; font-weight:700; font-size:16px; padding:12px 0; display:flex; align-items:center; gap:10px; }
    .section > summary::-webkit-details-marker{ display:none; }
    .chev{ transition: transform .15s; color:#9ca3af; }
    details[open] > summary .chev{ transform: rotate(90deg); }
    .cpill{ font-size:12px; font-weight:600; background:#eef2ff; color:#3730a3; border-radius:999px; padding:2px 9px; }
    .country{ margin-left:6px; }

    .grid{ display:grid; grid-template-columns: 1fr; gap:14px; margin:6px 0 14px; }
    @media (min-width: 700px){ .grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (min-width: 1000px){ .grid{ grid-template-columns: repeat(3, minmax(0, 1fr)); } }

    .trial{ border:1px solid #e5e7eb; border-radius:14px; padding:14px; background:#fff; display:flex; flex-direction:column; gap:10px; min-height: 200px; }
    .badgeRow{ display:flex; gap:8px; flex-wrap:wrap; }
    .badge{ font-size:12px; border:1px solid #d1d5db; border-radius:999px; padding:4px 10px; background:#f9fafb; white-space: nowrap; }
    .badge.status-recruiting{ background:#ecfdf5; border-color:#10b981; color:#065f46; }
    .badge.status-soon{ background:#eff6ff; border-color:#3b82f6; color:#1e40af; }
    .badge.status-other{ background:#f3f4f6; border-color:#9ca3af; color:#374151; }
    .dist{ font-size:13px; color:#065f46; font-weight:600; }
    .loc{ font-size:13px; color:#6b7280; }
    button{ padding:10px 12px; border-radius:10px; border:1px solid #d1d5db; background:#f9fafb; cursor:pointer; font-weight:600; text-align:left; font: inherit; }
    button:hover{ background:#f3f4f6; }
    .actions{ margin-top:auto; display:flex; gap:10px; flex-wrap:wrap; align-items: center; }

    @media (max-width: 900px){ .filters{ grid-template-columns: 1fr 1fr; } }
    @media (max-width: 560px){ .filters{ grid-template-columns: 1fr; } }

    .modalBackdrop{ position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center; padding: 12px; z-index: 9999; }
    .modal{ width: 100%; max-width: 820px; background: #fff; border-radius: 16px; border: 1px solid #e5e7eb; max-height: calc(100vh - 24px); overflow: hidden; display:flex; flex-direction: column; }
    .modalHeader{ display:flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #e5e7eb; background: #fff; }
    .modalHeader h3{ margin:0; font-size: 16px; line-height: 1.3; }
    .closeBtn{ width:auto; text-align:center; white-space: nowrap; }
    .modalBody{ padding: 14px 16px; overflow: auto; -webkit-overflow-scrolling: touch; }
    .modalBody ul{ margin: 8px 0 0 18px; }
  </style>
</head>

<body>
  <header>
    <h1 style="margin:0;">Cancer Clinical Trials</h1>
    <nav>
      <a href="index.html">Cancer Types</a>
      <a href="trials.html">Trial List</a>
      <a href="intake.html">Intake</a>
      <a href="illinois/research-deserts.html">Research Deserts</a>
    </nav>
  </header>

  <section class="card">
    <h2 style="margin:0;">Find open trials near you</h2>
    <p class="muted" style="margin:6px 0 0 0;">
      Live from <a href="https://clinicaltrials.gov" target="_blank" rel="noreferrer">ClinicalTrials.gov</a>.
      Enter your ZIP code and choose a disease group — trials are grouped by how far the nearest study site is from you.
    </p>

    <div class="filters">
      <div>
        <label class="f" for="zip">Your ZIP code</label>
        <div class="zipRow"><input id="zip" inputmode="numeric" maxlength="5" placeholder="e.g., 60601" /></div>
      </div>
      <div>
        <label class="f" for="cancer">Cancer type</label>
        <select id="cancer">
          <option value="">All cancer types</option>
          <option>Bladder cancer</option>
          <option>Brain cancer</option>
          <option>Breast cancer</option>
          <option>Childhood cancer</option>
          <option>Colon &amp; rectal cancer</option>
          <option>Gastrointestinal cancer</option>
          <option>Gynecologic cancer</option>
          <option>Head &amp; neck cancer</option>
          <option>Kidney cancer</option>
          <option>Lung cancer</option>
          <option>Prostate cancer</option>
          <option>Skin cancer</option>
          <option>Testicular cancer</option>
        </select>
      </div>
      <div>
        <label class="f" for="status">Status</label>
        <select id="status">
          <option value="RECRUITING">Recruiting (open)</option>
          <option value="NOT_YET_RECRUITING">Not yet recruiting</option>
          <option value="">Any status</option>
        </select>
      </div>
      <div>
        <label class="f" for="q">Search within results</label>
        <input id="q" placeholder="keyword, NCT ID" />
      </div>
    </div>

    <div id="locNote" class="locNote muted"></div>
    <div id="results"></div>
    <p id="count" class="muted"></p>
  </section>

  <div id="backdrop" class="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="modal">
      <div class="modalHeader">
        <h3 id="mTitle"></h3>
        <button id="close" class="closeBtn">Close</button>
      </div>
      <div id="mBody" class="modalBody muted"></div>
      <div style="padding: 0 16px 16px 16px;">
        <a id="mLink" href="#" target="_blank" rel="noreferrer">Open on ClinicalTrials.gov</a>
      </div>
    </div>
  </div>

  <script>
    const API = "https://clinicaltrials.gov/api/v2/studies";
    const CONDITION_QUERY = {
      "Bladder cancer":"bladder cancer OR urothelial carcinoma",
      "Brain cancer":"brain tumor OR glioblastoma OR glioma OR astrocytoma",
      "Breast cancer":"breast cancer",
      "Childhood cancer":"childhood cancer OR pediatric cancer",
      "Colon & rectal cancer":"colorectal cancer",
      "Gastrointestinal cancer":"gastrointestinal cancer OR colorectal cancer OR pancreatic cancer OR gastric cancer OR esophageal cancer OR liver cancer",
      "Gynecologic cancer":"ovarian cancer OR cervical cancer OR endometrial cancer OR uterine cancer",
      "Head & neck cancer":"head and neck cancer",
      "Kidney cancer":"kidney cancer OR renal cell carcinoma",
      "Lung cancer":"lung cancer OR NSCLC OR SCLC",
      "Prostate cancer":"prostate cancer",
      "Skin cancer":"skin cancer OR melanoma",
      "Testicular cancer":"testicular cancer"
    };
    const NEAR_PAGE = 200, BROAD_PAGE = 120;

    const zipEl = document.getElementById("zip");
    const qEl = document.getElementById("q");
    const cancerEl = document.getElementById("cancer");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const countEl = document.getElementById("count");
    const locNoteEl = document.getElementById("locNote");
    const backdrop = document.getElementById("backdrop");
    const closeBtn = document.getElementById("close");
    const mTitle = document.getElementById("mTitle");
    const mBody = document.getElementById("mBody");
    const mLink = document.getElementById("mLink");

    let USER = null;         // {lat,lng,place,zip}
    let TRIALS = [];         // models with .study, .bucket, .dist, .country
    let queryToken = 0;

    // ---------- helpers ----------
    const cleanText = s => (s||"").replace(/\s+/g," ").trim();
    const firstNonEmpty = (...v) => { for (const x of v) if (typeof x==="string" && x.trim()) return x.trim(); return ""; };
    function escapeHtml(s){ return String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"); }
    function prettyStatus(raw){
      const m={RECRUITING:"Recruiting",NOT_YET_RECRUITING:"Not yet recruiting",ENROLLING_BY_INVITATION:"Enrolling by invitation",ACTIVE_NOT_RECRUITING:"Active, not recruiting",COMPLETED:"Completed",SUSPENDED:"Suspended",TERMINATED:"Terminated",WITHDRAWN:"Withdrawn"};
      return m[raw] || cleanText((raw||"").replaceAll("_"," ").toLowerCase());
    }
    function statusClass(raw){ return raw==="RECRUITING"?"status-recruiting":(raw==="NOT_YET_RECRUITING"||raw==="ENROLLING_BY_INVITATION")?"status-soon":"status-other"; }
    function getPhaseText(d){ const p=(Array.isArray(d?.phases)?d.phases:[]).filter(x=>x&&x!=="NA").map(x=>x.replace("PHASE","Phase ").replace("_"," ")); return p.length?p.join(", "):"Phase not listed"; }
    function getSponsor(s){ return s?.leadSponsor?.name ? cleanText(s.leadSponsor.name) : "Sponsor not listed"; }
    function getOverview(d){ return firstNonEmpty(d?.briefSummary,d?.detailedDescription,"").replace(/\r/g," ").replace(/\n+/g," ").replace(/\s+/g," ").trim(); }
    function shortOverview(text,{phase,diseaseFocus}){
      const parts=[]; if(phase&&phase!=="Phase not listed")parts.push(`This is a ${phase} clinical trial.`); if(diseaseFocus)parts.push(`It focuses on ${diseaseFocus}.`);
      const prefix=parts.length?parts.join(" ")+" ":""; if(!text)return prefix||"Study overview is not listed on ClinicalTrials.gov.";
      const s=text.split(/(?<=[.?!])\s+/).filter(Boolean).slice(0,3).join(" "); return (prefix+(s.length>650?s.slice(0,650).trim()+"…":s)).trim();
    }
    function parseElig(raw){
      const text=(raw||"").replace(/\r/g,""); if(!text.trim())return{inclusion:[],exclusion:[]};
      const l=text.toLowerCase(), i=l.indexOf("inclusion criteria"), e=l.indexOf("exclusion criteria");
      let inc="",exc=""; if(i!==-1&&e!==-1){ if(i<e){inc=text.slice(i,e);exc=text.slice(e);}else{exc=text.slice(e,i);inc=text.slice(i);} } else if(i!==-1)inc=text.slice(i); else if(e!==-1)exc=text.slice(e);
      const bul=t=>{const c=t.replace(/inclusion criteria[:\s]*/i,"").replace(/exclusion criteria[:\s]*/i,"").trim(); return c?c.split(/\n+/).map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/^[-–•\s]*/,"").trim()).slice(0,8):[];};
      return{inclusion:bul(inc),exclusion:bul(exc)};
    }
    function whoCanJoin(focus,el){
      const who=[]; if(el?.minimumAge||el?.maximumAge){const a=[];if(el.minimumAge)a.push(`at least ${el.minimumAge}`);if(el.maximumAge)a.push(`up to ${el.maximumAge}`);who.push(`Age: People who are ${a.join(" and ")}.`);}
      if(el?.sex&&el.sex!=="ALL")who.push(`Sex: only ${el.sex.toLowerCase()} participants.`); if(focus)who.push(`Condition: People diagnosed with ${focus}.`);
      const p=parseElig(el?.eligibilityCriteria||""); if(p.inclusion.length)return[...who,...p.inclusion].slice(0,8); who.push("Other eligibility rules apply; the study team will confirm eligibility."); return who.slice(0,8);
    }
    function whoCannotJoin(el){ const p=parseElig(el?.eligibilityCriteria||""); return p.exclusion.length?p.exclusion.slice(0,8):["People who do not meet the study’s eligibility requirements.","The study team will confirm eligibility after review."]; }

    function haversineMi(a,b,c,d){ const R=3958.8,r=x=>x*Math.PI/180; const dLat=r(c-a),dLon=r(d-b); const h=Math.sin(dLat/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
    const isUS = c => { const s=(c||"").toLowerCase(); return s==="united states"||s==="usa"||s==="us"; };

    async function geocodeZip(zip){
      const res = await fetch(`https://api.zippopotam.us/us/${encodeURIComponent(zip)}`);
      if(!res.ok) throw new Error("ZIP not found");
      const d = await res.json(); const pl = d.places && d.places[0];
      if(!pl) throw new Error("ZIP not found");
      return { lat:+pl.latitude, lng:+pl.longitude, place:`${pl["place name"]}, ${pl["state abbreviation"]}`, zip };
    }

    function toModel(study){
      const p = study.protocolSection||{};
      const id = p.identificationModule?.nctId||"";
      const locs = (p.contactsLocationsModule?.locations||[]).map(L=>({
        facility:L.facility||"", city:L.city||"", state:L.state||"", country:L.country||"",
        status:L.status||"", lat:L.geoPoint?.lat ?? null, lon:L.geoPoint?.lon ?? null
      }));
      return {
        study, id, ctgovLink:`https://clinicaltrials.gov/study/${id}`,
        title: firstNonEmpty(p.identificationModule?.briefTitle, p.identificationModule?.officialTitle, "Title not listed"),
        phase: getPhaseText(p.designModule),
        rawStatus: p.statusModule?.overallStatus||"", statusText: prettyStatus(p.statusModule?.overallStatus||""),
        cancer: (p.conditionsModule?.conditions||[])[0] || "Cancer",
        sponsor: getSponsor(p.sponsorCollaboratorsModule),
        locs, bucket:null, dist:null, nearest:null, country:null
      };
    }

    // classify each trial into a distance bucket relative to USER
    function classify(t){
      t.dist=null; t.nearest=null; t.country=null; t.bucket="us";
      if(USER){
        const usGeo = t.locs.filter(l=>isUS(l.country) && l.lat!=null);
        if(usGeo.length){
          let best=null,bd=Infinity;
          for(const l of usGeo){ const d=haversineMi(USER.lat,USER.lng,l.lat,l.lon); if(d<bd){bd=d;best=l;} }
          t.dist=bd; t.nearest=best; t.country="United States";
          t.bucket = bd<=50?"d50":bd<=100?"d100":bd<=200?"d200":"us";
          return t;
        }
      }
      // any US site (no geo / no ZIP) -> US bucket
      const anyUS = t.locs.find(l=>isUS(l.country));
      if(anyUS && (!USER)){ t.country="United States"; t.nearest=anyUS; t.bucket="us"; return t; }
      if(anyUS){ t.country="United States"; t.nearest=anyUS; t.bucket="us"; return t; }
      // otherwise non-US -> world, grouped by nearest (or first) country
      const nonUS = t.locs.filter(l=>l.country && !isUS(l.country));
      if(nonUS.length){
        let pick=nonUS[0];
        if(USER){ let bd=Infinity; for(const l of nonUS){ if(l.lat!=null){ const d=haversineMi(USER.lat,USER.lng,l.lat,l.lon); if(d<bd){bd=d;pick=l;t.dist=d;} } } }
        t.country=pick.country; t.nearest=pick; t.bucket="world"; return t;
      }
      t.country=null; t.bucket="us"; return t; // location unknown
    }

    // ---------- query ----------
    function buildUrl(cond, statusVal, geo, pageSize){
      const p = new URLSearchParams();
      p.set("query.cond", cond);
      if(statusVal) p.set("filter.overallStatus", statusVal);
      if(geo) p.set("filter.geo", geo);
      p.set("pageSize", String(pageSize));
      p.set("countTotal", "true");
      return `${API}?${p.toString()}`;
    }
    function ctgovSearchLink(cond, statusVal, zip){
      const p = new URLSearchParams(); p.set("cond", cond);
      const agg=[]; if(statusVal==="RECRUITING")agg.push("status:rec"); if(statusVal==="NOT_YET_RECRUITING")agg.push("status:not");
      if(agg.length)p.set("aggFilters",agg.join(",")); if(zip)p.set("locStr",zip);
      return `https://clinicaltrials.gov/search?${p.toString()}`;
    }
    async function fetchStudies(url){
      const res = await fetch(url,{headers:{Accept:"application/json"}});
      if(!res.ok) throw new Error(`ClinicalTrials.gov returned ${res.status}`);
      return await res.json();
    }

    async function load(){
      const token = ++queryToken;
      const label = cancerEl.value;
      const cond = CONDITION_QUERY[label] || (label || "cancer");
      const statusVal = statusEl.value;

      resultsEl.innerHTML = `<div class="muted" style="margin-top:12px;">Loading open trials from ClinicalTrials.gov…</div>`;
      countEl.textContent = "";

      try{
        const byId = new Map();
        // near query (geo) when we have the user's location
        if(USER){
          const near = await fetchStudies(buildUrl(cond, statusVal, `distance(${USER.lat},${USER.lng},200mi)`, NEAR_PAGE));
          (near.studies||[]).forEach(s=>{ const m=toModel(s); if(m.id) byId.set(m.id,m); });
        }
        // broad query for the US-elsewhere + world buckets (and the whole list when no ZIP)
        const broad = await fetchStudies(buildUrl(cond, statusVal, null, BROAD_PAGE));
        let broadTotal = broad.totalCount || 0;
        (broad.studies||[]).forEach(s=>{ const m=toModel(s); if(m.id && !byId.has(m.id)) byId.set(m.id,m); });

        if(token !== queryToken) return;
        TRIALS = [...byId.values()].map(classify);
        render(broadTotal, cond, statusVal);
      }catch(e){
        if(token !== queryToken) return;
        const link = ctgovSearchLink(cond, statusVal, USER?.zip||"");
        resultsEl.innerHTML = `<div class="muted">Couldn’t load trials right now (${escapeHtml(e.message||"network error")}).</div>
          <div style="margin-top:8px;"><a href="${link}" target="_blank" rel="noreferrer">View these open trials on ClinicalTrials.gov →</a></div>`;
        countEl.textContent="";
      }
    }

    function keywordMatch(t){
      const q = cleanText(qEl.value).toLowerCase(); if(!q) return true;
      return [t.id,t.title,t.cancer,t.phase,t.statusText,t.sponsor,(t.nearest? [t.nearest.facility,t.nearest.city,t.nearest.state].join(" "):"")].join(" ").toLowerCase().includes(q);
    }

    function cardHtml(t){
      const dist = (t.dist!=null) ? `<div class="dist">≈ ${Math.round(t.dist)} mi away</div>` : "";
      const near = t.nearest ? `<div class="loc">📍 ${escapeHtml([t.nearest.facility,t.nearest.city,t.nearest.state||t.nearest.country].filter(Boolean).join(", "))}</div>` : "";
      return `<div class="trial">
        <div class="badgeRow">
          <span class="badge">${escapeHtml(t.cancer)}</span>
          <span class="badge">${escapeHtml(t.phase)}</span>
          <span class="badge ${statusClass(t.rawStatus)}">${escapeHtml(t.statusText)}</span>
        </div>
        <div>
          <div style="font-weight:700; font-size:16px;">${escapeHtml(t.title)}</div>
          <div class="muted"><a href="${t.ctgovLink}" target="_blank" rel="noreferrer">${escapeHtml(t.id)}</a>${t.sponsor?` • ${escapeHtml(t.sponsor)}`:""}</div>
          ${dist}${near}
        </div>
        <div class="actions">
          <button type="button" onclick="openModal('${escapeHtml(t.id)}')">View details</button>
          <a href="intake.html?nct=${encodeURIComponent(t.id)}">I’m interested</a>
        </div>
      </div>`;
    }

    function sectionHtml(title, items, open){
      if(!items.length) return "";
      const cards = items.sort((a,b)=>(a.dist??1e9)-(b.dist??1e9)).map(cardHtml).join("");
      return `<details class="section" ${open?"open":""}>
        <summary><span class="chev">▶</span>${escapeHtml(title)} <span class="cpill">${items.length}</span></summary>
        <div class="grid">${cards}</div>
      </details>`;
    }

    function render(broadTotal, cond, statusVal){
      const items = TRIALS.filter(keywordMatch);

      if(!USER){
        locNoteEl.innerHTML = `Enter your <strong>ZIP code</strong> above to group these trials by distance from you.`;
        resultsEl.innerHTML = sectionHtml("All open trials", items, true) || `<div class="muted" style="margin-top:12px;">No trials matched.</div>`;
      } else {
        locNoteEl.innerHTML = `Showing trials by distance from <strong>${escapeHtml(USER.place)} ${escapeHtml(USER.zip)}</strong>. <a href="#" id="clearZip">Change</a>`;
        const b = { d50:[], d100:[], d200:[], us:[], world:[] };
        items.forEach(t => b[t.bucket]?.push(t));
        // world grouped by country
        const worldByCountry = {};
        b.world.forEach(t => { (worldByCountry[t.country||"Other"] = worldByCountry[t.country||"Other"] || []).push(t); });
        const worldCountries = Object.keys(worldByCountry).sort((a,b2)=>worldByCountry[b2].length-worldByCountry[a].length);

        let html = "";
        html += sectionHtml("Within 50 miles", b.d50, true);
        html += sectionHtml("50–100 miles", b.d100, true);
        html += sectionHtml("100–200 miles", b.d200, false);
        html += sectionHtml("Elsewhere in the United States", b.us, false);
        if(b.world.length){
          const inner = worldCountries.map(c => sectionHtml(c, worldByCountry[c], false)).join("");
          html += `<details class="section"><summary><span class="chev">▶</span>Rest of the world <span class="cpill">${b.world.length}</span></summary><div style="padding-left:12px;">${inner}</div></details>`;
        }
        resultsEl.innerHTML = html || `<div class="muted" style="margin-top:12px;">No open trials matched for this area. Try a wider status or another disease group.</div>`;
        const clr = document.getElementById("clearZip");
        if(clr) clr.onclick = (e)=>{ e.preventDefault(); zipEl.value=""; USER=null; load(); };
      }

      const label = cancerEl.value || "all cancers";
      const link = ctgovSearchLink(cond, statusVal, USER?.zip||"");
      const totalNote = broadTotal ? ` ClinicalTrials.gov lists ${broadTotal.toLocaleString()} open ${escapeHtml(label)} trial(s) in total.` : "";
      countEl.innerHTML = `Loaded ${items.length} ${escapeHtml(label)} trial(s).${totalNote} <a href="${link}" target="_blank" rel="noreferrer">View all on ClinicalTrials.gov →</a>`;
    }

    function bulletsToHtml(arr){ return (!arr||!arr.length)?"<div class='muted'>Not listed.</div>":`<ul>${arr.map(x=>`<li>${escapeHtml(x)}</li>`).join("")}</ul>`; }

    window.openModal = function(id){
      const t = TRIALS.find(x=>x.id===id); if(!t) return;
      const p = t.study.protocolSection||{};
      const overview = shortOverview(getOverview(p.descriptionModule), { phase:t.phase, diseaseFocus:t.cancer });
      const can = whoCanJoin(t.cancer, p.eligibilityModule||{});
      const cannot = whoCannotJoin(p.eligibilityModule||{});
      const sites = (t.locs.filter(l=>/RECRUITING/i.test(l.status||"")).length?t.locs.filter(l=>/RECRUITING/i.test(l.status||"")):t.locs)
        .slice(0,5).map(l=>[l.facility,l.city,l.state||l.country].filter(Boolean).join(", "));
      mTitle.textContent = `${t.title} (${t.id})`;
      mBody.innerHTML = `
        <div><strong>Cancer:</strong> ${escapeHtml(t.cancer)}</div>
        <div><strong>Study phase:</strong> ${escapeHtml(t.phase)}</div>
        <div><strong>Status:</strong> <span class="badge ${statusClass(t.rawStatus)}">${escapeHtml(t.statusText)}</span></div>
        <div><strong>Sponsor:</strong> ${escapeHtml(t.sponsor)}</div>
        ${t.dist!=null?`<div><strong>Nearest site:</strong> ≈ ${Math.round(t.dist)} mi — ${escapeHtml([t.nearest.facility,t.nearest.city,t.nearest.state].filter(Boolean).join(", "))}</div>`:""}
        <div style="margin-top:10px;"><strong>ClinicalTrials.gov ID:</strong> <a href="${t.ctgovLink}" target="_blank" rel="noreferrer">${escapeHtml(t.id)}</a></div>
        <div style="margin-top:14px;"><strong>Study overview</strong></div><div style="margin-top:6px;">${escapeHtml(overview)}</div>
        <div style="margin-top:14px;"><strong>Who can join</strong></div>${bulletsToHtml(can)}
        <div style="margin-top:10px;"><strong>Who cannot join</strong></div>${bulletsToHtml(cannot)}
        ${sites.length?`<div style="margin-top:14px;"><strong>Recruiting sites</strong></div>${bulletsToHtml(sites)}`:""}
        <div style="margin-top:14px;"><strong>How to join</strong></div>
        <div>Ask your oncologist for a referral, or use the “I’m interested” button.</div>`;
      mLink.href = t.ctgovLink; backdrop.style.display = "flex";
    };
    function closeModal(){ backdrop.style.display="none"; }
    closeBtn.addEventListener("click", closeModal);
    backdrop.addEventListener("click", e=>{ if(e.target===backdrop) closeModal(); });
    document.addEventListener("keydown", e=>{ if(e.key==="Escape"&&backdrop.style.display==="flex") closeModal(); });

    // ---------- events ----------
    qEl.addEventListener("input", ()=>{ if(TRIALS.length) render(0, CONDITION_QUERY[cancerEl.value]||(cancerEl.value||"cancer"), statusEl.value); });
    cancerEl.addEventListener("change", load);
    statusEl.addEventListener("change", load);

    let zipTimer;
    async function onZip(){
      const zip = cleanText(zipEl.value);
      if(!/^\d{5}$/.test(zip)){ if(USER){ USER=null; load(); } return; }
      locNoteEl.textContent = "Looking up your ZIP…";
      try{ USER = await geocodeZip(zip); }
      catch(_){ USER=null; locNoteEl.innerHTML = `<span style="color:#b91c1c">Couldn’t find ZIP ${escapeHtml(zip)}. Check and try again.</span>`; return; }
      load();
    }
    zipEl.addEventListener("input", ()=>{ clearTimeout(zipTimer); zipTimer=setTimeout(onZip, 500); });

    (function init(){
      const params = new URLSearchParams(window.location.search);
      const c = params.get("cancer");
      if(c){ const opt=[...cancerEl.options].find(o=>o.value.toLowerCase()===c.toLowerCase()); if(opt) cancerEl.value=opt.value; }
      const z = params.get("zip"); if(z && /^\d{5}$/.test(z)) zipEl.value = z;
      if(zipEl.value){ onZip(); } else { load(); }
    })();
  </script>
</body>
</html>
